<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#070707">
    <title>Checklist - CONEXA</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400;700&family=Figtree:wght@300;400;500;600;700&family=Syne+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bk: #070707; --s1: #0D0D0D; --s2: #141414; --s3: #1C1C1C; --s4: #252525;
            --bd: rgba(255,255,255,0.07); --bd2: rgba(255,255,255,0.13);
            --w: #F4F2ED; --wd: rgba(244,242,237,0.52); --wf: rgba(244,242,237,0.1);
            --cu: #C4855A; --cu2: #8C5532; --cu3: rgba(196,133,90,0.15);
            --green: #4ade80; --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bk); color: var(--w); font-family: 'Figtree', sans-serif; line-height: 1.6; padding-bottom: 80px; }

        /* Header */
        header { background: var(--s1); border-bottom: 1px solid var(--bd); padding: 0.75rem 1rem; position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .back-btn { background: var(--s3); border: 1px solid var(--bd); color: var(--w); padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
        .project-title { font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 1rem; flex: 1; }
        .save-status { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: var(--wd); }
        .save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bd2); }
        .save-dot.saved { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .save-dot.pending { background: var(--cu); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        /* Activity Navigator */
        .activity-nav { background: var(--s2); border-bottom: 1px solid var(--bd); padding: 0.75rem 1rem; position: sticky; top: 52px; z-index: 99; }
        .activity-nav-title { font-size: 0.65rem; color: var(--wd); text-transform: uppercase; font-family: 'Syne Mono', monospace; margin-bottom: 0.5rem; }
        .activity-nav-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--cu) var(--s3); }
        .activity-nav-wrapper::-webkit-scrollbar { height: 4px; }
        .activity-nav-wrapper::-webkit-scrollbar-track { background: var(--s3); }
        .activity-nav-wrapper::-webkit-scrollbar-thumb { background: var(--cu); border-radius: 2px; }
        .activity-nav-grid { display: flex; gap: 0.4rem; min-width: max-content; padding-bottom: 0.25rem; }
        .activity-nav-btn { background: var(--s3); border: 1px solid var(--bd); color: var(--wd); padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.7rem; font-family: 'Syne Mono', monospace; cursor: pointer; text-align: center; transition: all 0.2s; flex-shrink: 0; min-width: 45px; }
        .activity-nav-btn:hover { border-color: var(--cu); color: var(--cu); }
        .activity-nav-btn.active { background: var(--cu); border-color: var(--cu); color: var(--w); }
        .activity-nav-btn.completed { background: var(--cu3); border-color: var(--cu); color: var(--cu); }

        /* Block Tabs */
        .block-tabs { background: var(--s1); border-bottom: 1px solid var(--bd); padding: 0.5rem 1rem; position: sticky; top: 110px; z-index: 98; overflow-x: auto; }
        .block-tabs-inner { display: flex; gap: 0.5rem; min-width: max-content; }
        .block-tab { padding: 0.5rem 1rem; font-size: 0.7rem; font-family: 'Syne Mono', monospace; color: var(--wd); cursor: pointer; border-radius: 4px; background: var(--s3); border: 1px solid var(--bd); transition: all 0.2s; }
        .block-tab.active { background: var(--cu); border-color: var(--cu); color: var(--w); }

        /* Main */
        main { padding: 1rem; max-width: 900px; margin: 0 auto; }

        /* Project Info Card */
        .info-card { background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
        .info-card-title { font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
        .info-item { display: flex; flex-direction: column; gap: 0.2rem; }
        .info-label { font-size: 0.65rem; color: var(--wd); text-transform: uppercase; font-family: 'Syne Mono', monospace; }
        .info-value { font-size: 0.85rem; color: var(--w); }

        /* Bloque */
        .bloque { background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; scroll-margin-top: 180px; }
        .bloque-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--bd); flex-wrap: wrap; gap: 0.5rem; }
        .bloque-title { font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 1.1rem; }
        .bloque-progress { display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem; color: var(--wd); }
        .progress-bar { width: 80px; height: 5px; background: var(--s3); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--cu); transition: width 0.3s; }

        /* Actividad */
        .actividad { background: var(--s1); border: 1px solid var(--bd); border-radius: 8px; padding: 0.875rem; margin-bottom: 0.75rem; scroll-margin-top: 180px; }
        .actividad-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .actividad-title { font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 0.95rem; }
        .actividad-num { font-size: 0.65rem; color: var(--cu); background: var(--cu3); padding: 0.2rem 0.5rem; border-radius: 4px; font-family: 'Syne Mono', monospace; }

        /* Checklist Table */
        .checklist-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .checklist-table th { text-align: left; padding: 0.5rem 0.3rem; font-size: 0.6rem; color: var(--wd); text-transform: uppercase; font-family: 'Syne Mono', monospace; border-bottom: 1px solid var(--bd); }
        .checklist-table td { padding: 0.5rem 0.3rem; border-bottom: 1px solid var(--s3); vertical-align: middle; }
        .checklist-table tr:last-child td { border-bottom: none; }
        .item-num { color: var(--cu); font-family: 'Syne Mono', monospace; font-size: 0.7rem; width: 30px; }
        .item-text { font-size: 0.8rem; }
        .item-criteria { font-size: 0.7rem; color: var(--wd); display: block; margin-top: 0.15rem; }
        .check-cell { text-align: center; width: 35px; }
        .checkbox-custom { width: 24px; height: 24px; border: 2px solid var(--bd2); border-radius: 5px; display: inline-flex; justify-content: center; align-items: center; cursor: pointer; }
        .checkbox-custom.checked { background: var(--cu); border-color: var(--cu); }
        .checkbox-custom.checked::after { content: '✓'; color: var(--w); font-size: 14px; font-weight: bold; }
        .obs-cell { min-width: 100px; }
        .obs-input { width: 100%; background: var(--s3); border: 1px solid var(--bd); border-radius: 4px; padding: 0.4rem 0.5rem; color: var(--w); font-size: 0.75rem; }
        .obs-input:focus { outline: none; border-color: var(--cu); }

        /* Holds Section */
        .holds-section { background: var(--s3); border-radius: 6px; padding: 0.75rem; margin-top: 0.75rem; }
        .holds-title { font-size: 0.65rem; color: var(--cu); text-transform: uppercase; font-family: 'Syne Mono', monospace; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.3rem; }
        .holds-title::before { content: '🔒'; }
        .holds-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -0.75rem; padding: 0 0.75rem; }
        .holds-table-wrapper::-webkit-scrollbar { height: 4px; }
        .holds-table-wrapper::-webkit-scrollbar-track { background: var(--s4); }
        .holds-table-wrapper::-webkit-scrollbar-thumb { background: var(--cu); border-radius: 2px; }
        .holds-table { width: 100%; border-collapse: collapse; font-size: 0.65rem; min-width: 450px; }
        .holds-table th { text-align: left; padding: 0.5rem 0.4rem; font-size: 0.55rem; color: var(--wd); text-transform: uppercase; border-bottom: 1px solid var(--bd); white-space: nowrap; }
        .holds-table td { padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--s4); vertical-align: middle; white-space: nowrap; }
        .holds-table tr:last-child td { border-bottom: none; }
        .hold-code { color: var(--cu); font-weight: 700; width: 45px; }
        .hold-responsable, .hold-verificacion { color: var(--wd); font-size: 0.6rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        .firma-input { width: 100%; background: var(--s2); border: none; border-bottom: 1px solid var(--bd2); padding: 0.4rem 0.5rem; color: var(--w); font-size: 0.7rem; min-width: 80px; }
        .firma-input:focus { outline: none; border-bottom-color: var(--cu); }

        /* Floating Action Bar */
        .floating-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--s1); border-top: 1px solid var(--bd); padding: 0.75rem 1rem; display: flex; gap: 0.5rem; justify-content: center; z-index: 100; }
        .float-btn { flex: 1; max-width: 120px; padding: 0.6rem 1rem; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.3rem; }
        .float-btn.primary { background: var(--cu); color: var(--w); }
        .float-btn.secondary { background: var(--s3); color: var(--w); border: 1px solid var(--bd); }
        .float-btn.danger { background: var(--s3); color: var(--red); border: 1px solid var(--red); }

        /* Toast */
        .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 0.6rem 1.25rem; font-size: 0.75rem; z-index: 2000; opacity: 0; transition: all 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.5); white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { border-color: var(--green); color: var(--green); }
        .toast.error { border-color: var(--red); color: var(--red); }
        .toast.info { border-color: var(--cu); color: var(--cu); }

        /* Loading */
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--bd); border-top-color: var(--cu); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr 1fr; }
            .checklist-table { font-size: 0.7rem; }
            .item-text { font-size: 0.72rem; }
            .item-criteria { font-size: 0.62rem; }
            .bloque, .actividad { scroll-margin-top: 170px; }
            .bloque-header { flex-direction: column; align-items: flex-start; }
            .bloque-progress { width: 100%; justify-content: flex-start; }
            .activity-nav { top: 52px; }
            .block-tabs { top: 105px; }
            .checkbox-custom { width: 28px; height: 28px; }
            .obs-input { font-size: 0.7rem; padding: 0.5rem; }
            .firma-input { font-size: 0.68rem; }
        }

        @media (max-width: 480px) {
            .activity-nav-grid { gap: 0.3rem; }
            .activity-nav-btn { padding: 0.4rem 0.6rem; font-size: 0.65rem; min-width: 40px; }
            .block-tab { padding: 0.4rem 0.75rem; font-size: 0.65rem; }
            .checklist-table { font-size: 0.65rem; }
            .item-text { font-size: 0.68rem; }
            .item-criteria { font-size: 0.6rem; }
            .bloque, .actividad { scroll-margin-top: 160px; }
            .info-card { padding: 0.75rem; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <button class="back-btn" onclick="window.history.back()">← Volver</button>
            <h1 class="project-title" id="project-title">Cargando...</h1>
            <div class="save-status">
                <span class="save-dot" id="save-dot"></span>
                <span id="save-text">Guardado</span>
            </div>
        </div>
    </header>

    <!-- Activity Navigator -->
    <div class="activity-nav">
        <div class="activity-nav-title">📍 Saltar a actividad</div>
        <div class="activity-nav-wrapper">
            <div class="activity-nav-grid" id="activity-nav"></div>
        </div>
    </div>

    <!-- Block Tabs -->
    <div class="block-tabs">
        <div class="block-tabs-inner">
            <div class="block-tab active" onclick="scrollToBloque(1)">Bloque 1</div>
            <div class="block-tab" onclick="scrollToBloque(2)">Bloque 2</div>
            <div class="block-tab" onclick="scrollToBloque(3)">Bloque 3</div>
            <div class="block-tab" onclick="scrollToBloque(4)">Bloque 4</div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="checklist-content">
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- Floating Action Bar -->
    <div class="floating-bar">
        <button class="float-btn secondary" onclick="exportarDatos()">📤 Exportar</button>
        <button class="float-btn primary" onclick="forzarGuardado()">💾 Guardar</button>
        <button class="float-btn danger" onclick="limpiarChecklist()">🗑️ Borrar</button>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Firebase & App Logic -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyB1GvqogyJ9ft_VT6N1Rp4EMJVZbrYYcWA",
            authDomain: "conexa---checklist.firebaseapp.com",
            projectId: "conexa---checklist",
            storageBucket: "conexa---checklist.firebasestorage.app",
            messagingSenderId: "828271606324",
            appId: "1:828271606324:web:d60590d82cb50afdd5e861",
            measurementId: "G-XJCYKR3L3Y"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        let projectId = null;
        let projectData = {};
        let checklistData = { checks: {}, obs: {}, firmas: {}, proyecto: {} };
        let isModified = false;
        let saveTimeout = null;

        // Activity definitions
        const ACTIVIDADES = [
            { num: 1, nombre: 'REDES ELÉCTRICAS', bloque: 1 },
            { num: 2, nombre: 'DEMOLICIONES Y RETIROS', bloque: 1 },
            { num: 3, nombre: 'PLOMERÍA', bloque: 1 },
            { num: 4, nombre: 'MAMPOSTERÍA', bloque: 1 },
            { num: 5, nombre: 'REVOQUES (PAÑETES)', bloque: 1 },
            { num: 6, nombre: 'ESTUCOS', bloque: 2 },
            { num: 7, nombre: 'CIELOS RASOS (RAS)', bloque: 2 },
            { num: 8, nombre: 'MORTERO DE NIVELACIÓN', bloque: 2 },
            { num: 9, nombre: 'CIELO RASO EN DRYWALL', bloque: 2 },
            { num: 10, nombre: 'PINTURA PRIMERA MANO', bloque: 2 },
            { num: 11, nombre: 'ENCHAPE', bloque: 3 },
            { num: 12, nombre: 'PINTURA SEGUNDA MANO', bloque: 3 },
            { num: 13, nombre: 'CARPINTERÍAS', bloque: 3 },
            { num: 14, nombre: 'INSTALACIÓN DE MESONES', bloque: 3 },
            { num: 15, nombre: 'TERCERA MANO DE PINTURA', bloque: 3 },
            { num: 16, nombre: 'BUITRÓN', bloque: 4 },
            { num: 17, nombre: 'APARATOS Y ACCESORIOS', bloque: 4 },
            { num: 18, nombre: 'DETALLADO DE NOVEDADES', bloque: 4 },
            { num: 19, nombre: 'ASEO GENERAL', bloque: 4 }
        ];

        // Get project ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        projectId = urlParams.get('id');

        // Check auth
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            if (!projectId) {
                showToast('No se encontró el proyecto', 'error');
                return;
            }
            loadProject();
        });

        async function loadProject() {
            try {
                const projectDoc = await getDoc(doc(db, 'proyectos', projectId));
                if (!projectDoc.exists()) {
                    showToast('Proyecto no encontrado', 'error');
                    return;
                }
                projectData = projectDoc.data();
                document.getElementById('project-title').textContent = projectData.nombre || 'Proyecto';

                // Load checklist data
                const checklistDoc = await getDoc(doc(db, 'checklists', projectId));
                if (checklistDoc.exists()) {
                    checklistData = checklistDoc.data();
                }

                renderChecklist();
                renderActivityNav();
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading project:', error);
                showToast('Error al cargar proyecto', 'error');
            }
        }

        function renderActivityNav() {
            const nav = document.getElementById('activity-nav');
            nav.innerHTML = ACTIVIDADES.map(act => `
                <div class="activity-nav-btn" id="nav-btn-${act.num}" onclick="scrollToActividad(${act.num})">
                    ${act.num}
                </div>
            `).join('');
        }

        function renderChecklist() {
            const main = document.getElementById('checklist-content');
            main.innerHTML = `
                <!-- Project Info -->
                <div class="info-card">
                    <div class="info-card-title">📋 Información del Proyecto</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Cliente</span>
                            <span class="info-value">${projectData.cliente || '-'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Dirección</span>
                            <span class="info-value">${projectData.direccion || '-'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Área</span>
                            <span class="info-value">${projectData.area || '-'} m²</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Teléfono</span>
                            <span class="info-value">${projectData.telefono || '-'}</span>
                        </div>
                    </div>
                </div>

                ${renderBloque1()}
                ${renderBloque2()}
                ${renderBloque3()}
                ${renderBloque4()}
            `;

            restoreState();
        }

        function renderBloque1() {
            return `
                <div class="bloque" id="bloque1">
                    <div class="bloque-header">
                        <div class="bloque-title">BLOQUE 1: ACTIVIDADES 1-5</div>
                        <div class="bloque-progress">
                            <span id="progreso-bloque1-text">0%</span>
                            <div class="progress-bar"><div class="progress-fill" id="progreso-bloque1" style="width: 0%"></div></div>
                        </div>
                    </div>

                    ${renderActividad(1, 'REDES ELÉCTRICAS', [
                        ['Cajas de salida', 'A plomo, altura según diseño (40cm/1.20m)'],
                        ['Tubería conduit', 'Recta, bien fijada, sin dobleces bruscos'],
                        ['Calibre de cables', 'Según diseño (AWG 12/14/10)'],
                        ['Colores de cables', 'Fase (rojo/negro), Neutro (blanco), Tierra (verde)'],
                        ['Tablero eléctrico', 'Instalado, circuitos identificados'],
                        ['Puestas a tierra', 'Instaladas, resistencia < 25 ohmios'],
                        ['Prueba de continuidad', 'Todos los circuitos continuos'],
                        ['Prueba de polaridad', 'Fase-neutro-tierra correctos en todos los puntos'],
                        ['Cajas empotradas', 'A ras con muro, sin daños'],
                        ['Protecciones', 'Cables protegidos, sin expuestos'],
                        ['Ductos en losa', 'Instalados antes de vaciado, bien fijados'],
                        ['Caja para interruptores', 'Altura 1.20m, alineada con puertas'],
                        ['Circuitos independientes', 'Cocina, lavandería, duchas separados'],
                        ['Capacidad tablero', 'Breakers correctos por circuito (15A/20A/30A)'],
                        ['Etiquetado', 'Todos los cables identificados en tablero']
                    ], 1)}

                    ${renderActividad(2, 'DEMOLICIONES Y RETIROS', [
                        ['Área protegida', 'Pisos, marcos, elementos a conservar protegidos'],
                        ['Servicios cortados', 'Agua, luz, gas cerrados antes de demolición'],
                        ['Demolición completa', 'Según alcance, sin residuos de muros demolados'],
                        ['Bordes de corte', 'Rectos, limpios, sin desprendimientos'],
                        ['Varillas expuestas', 'Cortadas a ras, sin puntas peligrosas'],
                        ['Escombros retirados', 'Área limpia, escombros en contenedor'],
                        ['Elementos a conservar', 'Sin daños, limpios, funcionales'],
                        ['Instalaciones existentes', 'Tuberías/cables no afectados sin protección'],
                        ['Polvo controlado', 'Área humedecida, ventilación adecuada'],
                        ['EPP utilizado', 'Todo el personal con equipo completo'],
                        ['Herramientas adecuadas', 'Martillo, esmeril, taladro según material'],
                        ['Andamios/escaleras', 'Estables, en buen estado'],
                        ['Señalización', 'Área demarcada, señal de demolición'],
                        ['Entrega del área', 'Limpia, lista para siguiente actividad'],
                        ['Acta de recibido', 'Firmada por director de obra']
                    ], 2)}

                    ${renderActividad(3, 'PLOMERÍA', [
                        ['Tuberías de agua', 'PVC CPVC/PPR según diseño, rectas'],
                        ['Tuberías de desagüe', 'PVC sanitario, con pendiente'],
                        ['Pendientes de desagüe', '1-2% hacia desagüe principal'],
                        ['Soportes de tubería', 'Cada 1.5m (horizontal), cada 3m (vertical)'],
                        ['Prueba de presión agua', '150 PSI por 2 horas, sin fugas'],
                        ['Prueba de desagües', 'Agua fluye rápido, sin estancamientos'],
                        ['Salidas de agua', 'Alturas correctas (lavamanos 85cm, ducha 1.20m)'],

                10: [['Imprimación aplicada y secada', 'Director de Obra', 'Inspección visual, tacto'], ['Protecciones instaladas antes de pintar', 'Director de Obra', 'Revisión visual'], ['Corte de bordes completado', 'Maestro Pintor', 'Inspección visual'], ['Primera mano terminada (cobertura uniforme)', 'Director de Obra', 'Luz rasante']],
                11: [['Impermeabilización + prueba de agua (24h)', 'Director de Obra', 'Inspección visual, sin fugas'], ['Pendientes verificadas (1-2% hacia desagüe)', 'Director de Obra', 'Nivel'], ['Antes de lechada (juntas, nivel, alineación)', 'Director de Obra', 'Inspección visual completa'], ['Enchape terminado (lechada + silicón)', 'Director de Obra', 'Inspección visual, prueba de agua']],
                12: [['Primera mano seca (24 horas mínimo)', 'Maestro Pintor', 'Tacto, sin humedad'], ['Lijado y limpieza completados', 'Maestro Pintor', 'Inspección visual, tacto'], ['Segunda mano aplicada (cobertura uniforme)', 'Director de Obra', 'Luz rasante'], ['Defectos corregidos antes de tercera mano', 'Director de Obra', 'Luz rasante']],
                13: [['Marcos instalados (plomo, nivel, fijación)', 'Director de Obra', 'Nivel, plomo'], ['Puertas funcionando (sin rozar, holguras)', 'Director de Obra', 'Operación manual'], ['Closets nivelados y fijados al muro', 'Director de Obra', 'Nivel, inspección visual'], ['Todos los herrajes verificados', 'Director de Obra', 'Operación manual completa']],
                14: [['Gabinetes nivelados y fijos', 'Director de Obra', 'Nivel, inspección visual'], ['Mesón nivelado y apoyado completamente', 'Director de Obra', 'Nivel, inspección visual'], ['Lavaplatos sellado (prueba de agua sin fugas)', 'Director de Obra', 'Prueba de agua'], ['Silicón aplicado (todos los encuentros)', 'Director de Obra', 'Inspección visual']],
                15: [['Segunda mano seca (24-48 horas)', 'Maestro Pintor', 'Tacto, sin humedad'], ['Defectos corregidos antes de tercera mano', 'Director de Obra', 'Luz rasante'], ['Tercera mano aplicada (cobertura total, brillo uniforme)', 'Director de Obra', 'Luz rasante'], ['Entrega del área (limpia, sin salpicaduras)', 'Director de Obra', 'Walkthrough final']],
                16: [['Refuerzo instalado (varillas, separadores)', 'Director de Obra', 'Inspección visual'], ['Concreto vaciado (f\'c especificado)', 'Director de Obra', 'Slump test, probeta'], ['Tapa instalada (nivelada, ajustada)', 'Director de Obra', 'Nivel, inspección visual'], ['Entrega (accesible, funcional)', 'Director de Obra', 'Prueba de acceso']],
                17: [['Sanitarios instalados (fijos, sin fugas)', 'Director de Obra', 'Prueba de agua'], ['Grifería instalada (sin fugas, funciona)', 'Director de Obra', 'Prueba de funcionamiento'], ['Accesorios fijos (toalleros, espejos, etc.)', 'Director de Obra', 'Inspección visual, prueba de carga'], ['Prueba general (todo funciona, sin fugas)', 'Director de Obra', 'Walkthrough completo']],
                18: [['Recorrido completo realizado', 'Director de Obra', 'Lista de verificación firmada'], ['Novedades documentadas (lista + fotos)', 'Director de Obra', 'Informe con anexos'], ['Informe compartido con equipo', 'Director de Obra', 'Confirmación de recepción'], ['Plan de acción aprobado', 'Cliente / Dirección Técnica', 'Firma de aprobación']],
                19: [['Escombros y herramientas retirados', 'Director de Obra', 'Recorrido visual'], ['Protecciones retiradas sin daños', 'Director de Obra', 'Inspección visual'], ['Pisos y enchapes limpios', 'Director de Obra', 'Inspección visual, tacto'], ['Entrega (inmaculado, listo)', 'Director de Obra / Cliente', 'Walkthrough final conjunto']]
            };

            const holds = holdsData[actNum] || [['Verificación inicial', 'Director de Obra', 'Revisión'], ['Verificación durante', 'Director de Obra', 'Revisión'], ['Verificación final', 'Director de Obra', 'Revisión'], ['Aprobación', 'Director de Obra', 'Revisión']];

            const holdsRows = holds.map((hold, idx) => `
                <tr>
                    <td class="hold-code">H${idx + 1}</td>
                    <td>${hold[0]}</td>
                    <td style="color: var(--wd); font-size: 0.65rem;">${hold[1]}</td>
                    <td style="color: var(--wd); font-size: 0.65rem;">${hold[2]}</td>
                    <td><input type="text" class="firma-input" placeholder="Firma" data-firma="${actNum}-h${idx + 1}" oninput="guardarFirma('${actNum}-h${idx + 1}', this.value)"></td>
                </tr>
            `).join('');

            return `
                <div class="actividad" id="actividad-${actNum}" data-actividad="${actNum}">
                    <div class="actividad-header">
                        <h3 class="actividad-titulo">${titulo}</h3>
                        <span class="actividad-num">ACT ${String(actNum).padStart(2, '0')}</span>
                    </div>
                    <table class="checklist-table">
                        <thead>
                            <tr>
                                <th style="width: 30px;">#</th>
                                <th>Ítem / Criterio</th>
                                <th style="width: 40px;">✓</th>
                                <th style="width: 100px;">Obs</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                    <div class="holds-section">
                        <div class="holds-title">STAKEHOLDER HOLDS</div>
                        <div class="holds-table-wrapper">
                            <table class="holds-table">
                                <thead>
                                    <tr>
                                        <th class="hold-code">Hold</th>
                                        <th>Punto de Control</th>
                                        <th class="hold-responsable">Responsable</th>
                                        <th class="hold-verificacion">Verificación</th>
                                        <th style="width: 100px;">Firma</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${holdsRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function restoreState() {
            // Restore checks
            Object.entries(checklistData.checks || {}).forEach(([id, checked]) => {
                if (checked) {
                    const el = document.querySelector(`.checkbox-custom[onclick*="'${id}'"]`);
                    if (el) {
                        el.classList.add('checked');
                        // Update activity nav
                        const actNum = id.split('-')[0];
                        updateActivityNavStatus(actNum);
                    }
                }
            });

            // Restore observations
            Object.entries(checklistData.obs || {}).forEach(([id, value]) => {
                const input = document.querySelector(`.obs-input[data-obs="${id}"]`);
                if (input) input.value = value || '';
            });

            // Restore firmas
            Object.entries(checklistData.firmas || {}).forEach(([id, value]) => {
                const input = document.querySelector(`.firma-input[data-firma="${id}"]`);
                if (input) input.value = value || '';
            });

            updateAllProgress();
            setupActivityNavObserver();
        }

        // Setup Intersection Observer para actualizar el navegador de actividades
        function setupActivityNavObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.intersectionRatio > 0.3) {
                        const actNum = entry.target.dataset.actividad;
                        if (actNum) {
                            document.querySelectorAll('.activity-nav-btn').forEach(btn => {
                                btn.classList.remove('active');
                            });
                            const activeBtn = document.getElementById(`nav-btn-${actNum}`);
                            if (activeBtn) {
                                activeBtn.classList.add('active');
                                // Scroll horizontal para mantener el botón visible
                                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                            }
                        }
                    }
                });
            }, { rootMargin: '-20% 0px -60% 0px', threshold: [0.3, 0.5, 0.8] });

            document.querySelectorAll('.actividad').forEach(act => {
                observer.observe(act);
            });
        }

        function updateActivityNavStatus(actNum) {
            const btn = document.getElementById(`nav-btn-${actNum}`);
            if (btn && !btn.classList.contains('completed')) {
                btn.classList.add('completed');
            }
        }

        window.toggleCheck = (id, el) => {
            el.classList.toggle('checked');
            checklistData.checks[id] = el.classList.contains('checked');
            markModified();
            updateProgress(el);
            updateActivityNavStatus(id.split('-')[0]);
            autoSave();
        };

        window.guardarObs = (id, value) => {
            checklistData.obs[id] = value;
            markModified();
            autoSave();
        };

        window.guardarFirma = (id, value) => {
            checklistData.firmas[id] = value;
            markModified();
            autoSave();
        };

        window.scrollToActividad = (actNum) => {
            const actividad = document.getElementById(`actividad-${actNum}`);
            if (actividad) {
                actividad.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Update active nav button
                document.querySelectorAll('.activity-nav-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                const activeBtn = document.getElementById(`nav-btn-${actNum}`);
                if (activeBtn) {
                    activeBtn.classList.add('active');
                    // Scroll horizontal para mantener el botón visible
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }
        };

        window.scrollToBloque = (num) => {
            const bloque = document.getElementById(`bloque${num}`);
            if (bloque) {
                bloque.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Update active tab
                document.querySelectorAll('.block-tab').forEach((tab, idx) => {
                    tab.classList.toggle('active', idx + 1 === num);
                });
                // Update activity nav to first activity of that block
                const firstActNum = (num - 1) * 5 + 1;
                document.querySelectorAll('.activity-nav-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                const firstBtn = document.getElementById(`nav-btn-${firstActNum}`);
                if (firstBtn) {
                    firstBtn.classList.add('active');
                    firstBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }
        };

        function markModified() {
            isModified = true;
            document.getElementById('save-dot').className = 'save-dot pending';
            document.getElementById('save-text').textContent = 'Guardando...';
        }

        function autoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveToFirebase();
            }, 1000);
        }

        window.forzarGuardado = async () => {
            await saveToFirebase();
            showToast('Datos guardados', 'success');
        };

        async function saveToFirebase() {
            try {
                await updateDoc(doc(db, 'checklists', projectId), {
                    checks: checklistData.checks,
                    obs: checklistData.obs,
                    firmas: checklistData.firmas,
                    updatedAt: serverTimestamp()
                });

                // Update project progress
                const totalChecks = document.querySelectorAll('.checkbox-custom').length;
                const checkedCount = document.querySelectorAll('.checkbox-custom.checked').length;
                const progreso = totalChecks > 0 ? Math.round((checkedCount / totalChecks) * 100) : 0;

                await updateDoc(doc(db, 'proyectos', projectId), {
                    progreso,
                    updatedAt: serverTimestamp()
                });

                isModified = false;
                document.getElementById('save-dot').className = 'save-dot saved';
                document.getElementById('save-text').textContent = 'Guardado';
            } catch (error) {
                console.error('Error saving:', error);
                showToast('Error al guardar', 'error');
            }
        }

        function updateProgress(el) {
            const bloque = el.closest('.bloque');
            if (!bloque) return;
            const bloqueId = bloque.id;
            const totalChecks = bloque.querySelectorAll('.checkbox-custom').length;
            const checkedCount = bloque.querySelectorAll('.checkbox-custom.checked').length;
            const porcentaje = totalChecks > 0 ? Math.round((checkedCount / totalChecks) * 100) : 0;

            document.getElementById(`progreso-${bloqueId}`).style.width = porcentaje + '%';
            document.getElementById(`${bloqueId}-text`).textContent = porcentaje + '%';
        }

        function updateAllProgress() {
            ['bloque1', 'bloque2', 'bloque3', 'bloque4'].forEach(id => {
                const bloque = document.getElementById(id);
                if (bloque) {
                    const totalChecks = bloque.querySelectorAll('.checkbox-custom').length;
                    const checkedCount = bloque.querySelectorAll('.checkbox-custom.checked').length;
                    const porcentaje = totalChecks > 0 ? Math.round((checkedCount / totalChecks) * 100) : 0;
                    document.getElementById(`progreso-${id}`).style.width = porcentaje + '%';
                    document.getElementById(`${id}-text`).textContent = porcentaje + '%';
                }
            });
        }

        window.exportarDatos = () => {
            const data = {
                proyecto: projectData,
                checklist: checklistData,
                fecha: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `checklist-${projectData.nombre?.replace(/[^a-z0-9]/gi, '_') || 'proyecto'}-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exportado', 'success');
        };

        window.limpiarChecklist = async () => {
            if (!confirm('¿Borrar TODOS los datos de esta checklist? Esta acción no se puede deshacer.')) return;

            try {
                await updateDoc(doc(db, 'checklists', projectId), {
                    checks: {},
                    obs: {},
                    firmas: {},
                    updatedAt: serverTimestamp()
                });

                await updateDoc(doc(db, 'proyectos', projectId), {
                    progreso: 0,
                    updatedAt: serverTimestamp()
                });

                location.reload();
            } catch (error) {
                console.error('Error clearing:', error);
                showToast('Error al borrar', 'error');
            }
        };

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
